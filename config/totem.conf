CONFIG_ZMK_USB_LOGGING=n

# Deep sleep disabled: keeps BLE connected between split halves so both
# wake instantly on any key press.
CONFIG_ZMK_SLEEP=n

# Idle timeout: CPU enters low-power mode after 15 min. BLE stays connected.
CONFIG_ZMK_IDLE_TIMEOUT=900000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Mouse event
CONFIG_ZMK_POINTING=y
